name: Azure Enterprise ACME
trigger:
  batch: "true"
  branches:
    include:
      - main

resources:
  repositories:
    - repository: cnp-azuredevops-libraries
      type: github
      ref: refs/heads/master
      name: hmcts/cnp-azuredevops-libraries
      endpoint: 'hmcts'

parameters:
  - name: overrideAction
    type: string
    default: plan
    values:
      - plan
      - apply

  - name: environment_components
    type: object
    default:
      - stage: 'dcd_cft_sandbox'
        service_connection: 'dcd-cft-sandbox-wif'
        environment: 'sbox'
      - stage: 'dcd_cftappsdata_demo'
        service_connection: 'dcd-cftappsdata-demo-wif'
        environment: 'demo'
      - stage: 'dcd_cftapps_demo'
        service_connection: 'dcd-cftapps-demo-wif'
        environment: 'demo'
      - stage: 'dcd_cftapps_dev'
        service_connection: 'dcd-cftapps-dev-wif'
        environment: 'dev'
      - stage: 'dcd_cftapps_ithc'
        service_connection: 'dcd-cftapps-ithc-wif'
        environment: 'ithc'
      - stage: 'dcd_cftapps_prod'
        service_connection: 'dcd-cftapps-prod-wif'
        environment: 'prod'
      - stage: 'dcd_cftapps_sbox'
        service_connection: 'dcd-cftapps-sbox-wif'
        environment: 'sbox'
      - stage: 'dcd_cftapps_stg'
        service_connection: 'dcd-cftapps-stg-wif'
        environment: 'stg'
      - stage: 'dcd_cftapps_test'
        service_connection: 'dcd-cftapps-test-wif'
        environment: 'test'
      - stage: 'dcd_cnp_dev'
        service_connection: 'dcd-cnp-dev-wif'
        environment: 'dev'
      - stage: 'dcd_cnp_prod'
        service_connection: 'dcd-cnp-prod-wif'
        environment: 'prod'
      - stage: 'dcd_cnp_qa'
        service_connection: 'dcd-cnp-qa-wif'
        environment: 'test'
      - stage: 'dts_cftptl_intsvc'
        service_connection: 'dts-cftptl-intsvc-wif'
        environment: 'ptl'
      - stage: 'dts_cftsbox_intsvc'
        service_connection: 'dts-cftsbox-intsvc-wif'
        environment: 'ptlsbox'
      - stage: 'dts_sharedservices_demo'
        service_connection: 'dts-sharedservices-demo-wif'
        environment: 'demo'
      - stage: 'dts_sharedservices_dev'
        service_connection: 'dts-sharedservices-dev-wif'
        environment: 'dev'
      - stage: 'dts_sharedservices_ithc'
        service_connection: 'dts-sharedservices-ithc-wif'
        environment: 'ithc'
      - stage: 'dts_sharedservices_prod'
        service_connection: 'dts-sharedservices-prod-wif'
        environment: 'prod'
      - stage: 'dts_sharedservicesptl'
        service_connection: 'dts-sharedservicesptl-wif'
        environment: 'ptl'
      - stage: 'dts_sharedservicesptl_sbox'
        service_connection: 'dts-sharedservicesptl-sbox-wif'
        environment: 'ptlsbox'
      - stage: 'dts_sharedservices_sbox'
        service_connection: 'dts-sharedservices-sbox-wif'
        environment: 'sbox'
      - stage: 'dts_sharedservices_stg'
        service_connection: 'dts-sharedservices-stg-wif'
        environment: 'stg'
      - stage: 'dts_sharedservices_test'
        service_connection: 'dts-sharedservices-test-wif'
        environment: 'test'
      - stage: 'dts_sps_sbox'
        service_connection: 'dts-sps-sbox-wif'
        environment: 'sbox'
      - stage: 'dts_sps_preview'
        service_connection: 'dts-sps-preview-wif'
        environment: 'dev'
      - stage: 'dts_sps_demo'
        service_connection: 'dts-sps-demo-wif'
        environment: 'demo'
      - stage: 'dts_sps_ithc'
        service_connection: 'dts-sps-ithc-wif'
        environment: 'ithc'
      - stage: 'dts_sps_perftest'
        service_connection: 'dts-sps-perftest-wif'
        environment: 'test'
      - stage: 'dts_sps_stg'
        service_connection: 'dts-sps-stg-wif'
        environment: 'stg'
      - stage: 'dts_sps_prod'
        service_connection: 'dts-sps-prod-wif'
        environment: 'prod'
      - stage: 'hmcts_hub_prod_intsvc'
        service_connection: 'hmcts-hub-prod-intsvc-wif'
        environment: 'prod'
      - stage: 'hmcts_hub_sbox_intsvc'
        service_connection: 'hmcts-hub-sbox-intsvc-wif'
        environment: 'sbox'
      - stage: 'hmcts_soc_prod'
        service_connection: 'hmcts-soc-prod-wif'
        environment: 'prod'
      - stage: 'hmcts_soc_sbox'
        service_connection: 'hmcts-soc-sbox-wif'
        environment: 'sbox'

variables:
  - name: timeoutInMinutes
    value: 60
  - name: agentPool
    value: ubuntu-latest
  - template: vars/input-variables.yaml@cnp-azuredevops-libraries
  - name: init_subscription
    value: '04d27a32-7a07-48b3-95b8-3c8691e1a263'
  - name: component
    value: acme


stages:
  - stage: Precheck
    jobs:
      - job: Precheck
        pool:
          vmImage: ${{ variables.agentPool }}
        timeoutInMinutes: ${{ variables.timeoutInMinutes }}
        steps:
          - template: steps/terraform-precheck.yaml@cnp-azuredevops-libraries
            parameters:
              keyvaultName: 'infra-vault-nonprod'
              keyvaultSecret: 'azure-devops-sp-token'
              serviceConnection: 'DCD-CFT-Sandbox-WIF'
              overrideAction: ${{ parameters.overrideAction }}

  - ${{ each deployment in parameters.environment_components }}:
      - stage: "${{ deployment.stage }}_acme"
        dependsOn: 'Precheck'
        jobs:
          - job: TerraformPlanApply
            pool:
              vmImage: ${{ variables.agentPool }}
            timeoutInMinutes: ${{ variables.timeoutInMinutes }}
            steps:
              - template: steps/terraform.yaml@cnp-azuredevops-libraries
                parameters:
                  overrideAction: ${{ parameters.overrideAction }}
                  environment: ${{ deployment.environment }}
                  component: ${{ variables.component }}
                  serviceConnection: ${{ deployment.service_connection }}
                  terraformInitSubscription: ${{ variables.init_subscription }}
                  stage: ${{ deployment.stage }}
                  ${{ if eq(deployment.stage, 'dts_sharedservices_sbox') }}:
                    terraformEnvironmentVariables:
                      TF_VAR_acme_version: 'v5.1.5'
                  ${{ if contains(deployment.stage, 'cft') }}:
                    product: 'cft-platform'
                  ${{ if contains(deployment.stage, 'cnp') }}:
                    product: 'cft-platform'
                  ${{ if contains(deployment.stage, 'sharedservices') }}:
                    product: 'sds-platform'
                  ${{ if contains(deployment.stage, 'sps') }}:
                    product: 'sps-platform'
                  ${{ if contains(deployment.stage, 'hub') }}:
                    product: 'hub'
                  ${{ if contains(deployment.stage, 'soc') }}:
                    product: 'soc'
                  ${{ if ne(deployment.subscription_id, '') }}:
                    planCommandOptions:
                      -var subscription_id=${{ deployment.subscription_id }}
